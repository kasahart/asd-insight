name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Restore hash-locked runtime downloads
        uses: actions/cache@v5
        with:
          path: runtime/prepared/runtime/audio
          # Exact key only: a partial restore could publish assets the lock no longer lists.
          key: audio-runtime-${{ hashFiles('runtime/lock.json', 'runtime/licenses/**', 'scripts/prepare-audio-runtime.py') }}
      - run: npm run runtime:prepare
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
